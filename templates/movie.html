<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ movie.title }} - StreamFlix</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>STREAMFLIX</h1>

    <nav>
        <a href="/">Home</a>
    </nav>

</header>


<section class="movie-details">

    <img
        src="{{ movie.poster_url }}"
        alt="{{ movie.title }}"
    >

    <div class="movie-info">

        <h2>{{ movie.title }}</h2>

        <p>
            {{ movie.year }} • {{ movie.genre }}
        </p>

        <p>
            ⭐ {{ movie.rating }}/10
        </p>

        <p>
            {{ movie.description }}
        </p>

        <button>
            ▶ Watch Now
        </button>

    </div>

</section>

</body>

</html>
